function _drawRestBackWall(ctx, W, wallH, ctrY, it) {
  const wallColors = ['#3d2515','#472a18','#52301e','#5e3824','#6a402a'];
  ctx.fillStyle = wallColors[Math.min(it, 4)];
  ctx.fillRect(0, 0, W, wallH);
  // 수직 판자 텍스처
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1;
  for (let x = 22; x < W; x += 22) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ctrY); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  for (let x = 8; x < W; x += 22) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ctrY); ctx.stroke(); }
  // 천장 몰딩
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, 5);
  ctx.fillStyle = '#7a5030'; ctx.fillRect(0, 3, W, 4);
}

function _drawRestWindows(ctx, W, H, sg, lt, winW, winH, winY) {
  const winXs = [];
  if (sg >= 1) { winXs.push(Math.round(W * 0.09), Math.round(W * 0.91 - winW)); }
  if (sg >= 2) { winXs.push(Math.round(W / 2 - winW / 2)); }
  winXs.forEach(wx => {
    ctx.fillStyle = '#4a2808'; ctx.fillRect(wx - 5, winY - 5, winW + 10, winH + 10);
    ctx.fillStyle = '#8ab8d8'; ctx.fillRect(wx, winY, winW, winH);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(wx + 2, winY + 2, winW / 2 - 4, winH / 2 - 4);
    ctx.fillRect(wx + winW / 2 + 2, winY + 2, winW / 2 - 4, winH / 2 - 4);
    ctx.fillStyle = '#4a2808';
    ctx.fillRect(wx + winW / 2 - 2, winY, 4, winH);
    ctx.fillRect(wx, winY + winH / 2 - 2, winW, 4);
    if (lt >= 1) { // 조명이 있으면 창문 아래 빛 기둥
      const beam = ctx.createLinearGradient(wx + winW / 2, winY + winH, wx + winW / 2, H);
      beam.addColorStop(0, 'rgba(255,245,210,0.14)'); beam.addColorStop(1, 'rgba(255,245,210,0)');
      ctx.fillStyle = beam; ctx.fillRect(wx - 10, winY + winH, winW + 20, H - winY - winH);
    }
  });
}

function _drawRestWallDecorations(ctx, W, it) {
  if (it >= 2) { // 책장
    const bx = 6, by = 10, bw = 38, bh = 60;
    ctx.fillStyle = '#5a3010'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#7a4820'; ctx.fillRect(bx + 2, by + 2, bw - 4, bh - 4);
    const bookColors = ['#c04020','#2060c0','#20a040','#c0a020','#8020c0'];
    for (let row = 0; row < 4; row++) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(bx + 2, by + 4 + row * 14, bw - 4, 1);
      bookColors.forEach((c, ci) => { ctx.fillStyle = c; ctx.fillRect(bx + 4 + ci * 7, by + 5 + row * 14, 5, 8); });
    }
  }
  if (it >= 3) { // 풍경화
    const ax = Math.round(W * 0.36), ay = 14;
    ctx.fillStyle = '#7a5020'; ctx.fillRect(ax - 3, ay - 3, 56, 44);
    ctx.fillStyle = '#ede0c0'; ctx.fillRect(ax, ay, 50, 38);
    const sky = ctx.createLinearGradient(ax, ay, ax, ay + 22);
    sky.addColorStop(0, '#3a6ea8'); sky.addColorStop(1, '#e8a040');
    ctx.fillStyle = sky; ctx.fillRect(ax, ay, 50, 22);
    ctx.fillStyle = '#2a5a20'; ctx.fillRect(ax, ay + 22, 50, 16);
    ctx.fillStyle = '#1a3810';
    ctx.beginPath(); ctx.arc(ax + 18, ay + 26, 9, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.arc(ax + 35, ay + 26, 7, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#7a5020'; ctx.lineWidth = 3; ctx.strokeRect(ax - 3, ay - 3, 56, 44);
  }
}

function _drawRestCounter(ctx, W, kt, ctrY, ctrH) {
  // 카운터 본체
  ctx.fillStyle = '#1e1008'; ctx.fillRect(0, ctrY, W, ctrH);
  ctx.fillStyle = '#3a2010'; ctx.fillRect(0, ctrY, W, 3);
  // 카운터 상판 (주방 레벨에 따라 색상 변화)
  const counterTopColors = ['#6a4020','#8a5828','#b09060','#d0b888','#e8d0a8'];
  ctx.fillStyle = counterTopColors[Math.min(kt, 4)]; ctx.fillRect(0, ctrY, W, 8);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(0, ctrY, W, 2);
  ctx.fillStyle = 'rgba(0,0,0,0.40)'; ctx.fillRect(0, ctrY + ctrH - 4, W, 4);
  // 주방 장비
  if (kt >= 1) { // 가스레인지
    ctx.fillStyle = '#333'; ctx.fillRect(70, ctrY - 26, 72, 22);
    ctx.fillStyle = '#222'; ctx.fillRect(72, ctrY - 24, 68, 18);
    [[88, ctrY - 18],[104, ctrY - 18],[88, ctrY - 10],[104, ctrY - 10]].forEach(([bx, by]) => {
      ctx.strokeStyle = kt >= 2 ? '#ff4400' : '#552200'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(bx, by, 5.5, 0, Math.PI * 2); ctx.stroke();
    });
  }
  if (kt >= 2) { // 냉장고
    ctx.fillStyle = '#909090'; ctx.fillRect(W - 72, ctrY - 50, 28, 52);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(W - 70, ctrY - 48, 24, 22); ctx.fillRect(W - 70, ctrY - 24, 24, 20);
    ctx.fillStyle = '#c0c0c0'; ctx.fillRect(W - 58, ctrY - 36, 4, 10);
  }
  if (kt >= 3) { // 환풍기
    ctx.fillStyle = '#666';
    ctx.beginPath(); ctx.moveTo(76, ctrY - 40); ctx.lineTo(148, ctrY - 40);
    ctx.lineTo(140, ctrY - 26); ctx.lineTo(84, ctrY - 26); ctx.closePath(); ctx.fill();
  }
  // 카운터 위 접시
  for (let pi = 0; pi < Math.min(kt + 1, 5); pi++) {
    const px = W * 0.52 + pi * 22;
    ctx.fillStyle = '#f0e8d8'; ctx.beginPath(); ctx.ellipse(px, ctrY - 10, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function _drawRestFloor(ctx, W, H, fl, floorY) {
  const baseFloorColors = ['#5e3a22','#7a4e30','#9a6440','#b07c50','#c89060'];
  ctx.fillStyle = baseFloorColors[Math.min(fl, 4)];
  ctx.fillRect(0, floorY, W, H - floorY);
  const flrImg = RST_IMGS.floor;
  if (flrImg && fl >= 1) {
    const flTiles = [null,
      {sx:96,  sy:4,  sw:44, sh:36},
      {sx:48,  sy:4,  sw:44, sh:36},
      {sx:96,  sy:44, sw:44, sh:36},
      {sx:144, sy:4,  sw:44, sh:36},
    ];
    const tile = flTiles[Math.min(fl, 4)];
    if (tile) { try {
      const ofc = document.createElement('canvas'); ofc.width = tile.sw; ofc.height = tile.sh;
      const oc  = ofc.getContext('2d'); oc.imageSmoothingEnabled = false;
      oc.drawImage(flrImg, tile.sx, tile.sy, tile.sw, tile.sh, 0, 0, tile.sw, tile.sh);
      const pat = ctx.createPattern(ofc, 'repeat');
      if (pat) { ctx.globalAlpha = fl >= 3 ? 0.72 : 0.58; ctx.fillStyle = pat; ctx.fillRect(0, floorY, W, H - floorY); ctx.globalAlpha = 1; }
    } catch (e) {} }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, floorY, W, 5);
}

function _drawRestLights(ctx, W, H, lt, floorY) {
  const numLights = lt >= 2 ? 3 : lt >= 1 ? 2 : 0;
  const lightXs   = numLights === 3 ? [W * 0.22, W * 0.5, W * 0.78] : numLights === 2 ? [W * 0.3, W * 0.7] : [];
  lightXs.forEach(lx => {
    // 빛 원뿔
    const intensity = lt >= 4 ? 0.30 : lt >= 3 ? 0.24 : lt >= 2 ? 0.18 : 0.13;
    const gcone = ctx.createRadialGradient(lx, floorY, 0, lx, floorY + 100, 150);
    gcone.addColorStop(0, `rgba(255,240,190,${intensity})`); gcone.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = gcone;
    ctx.beginPath(); ctx.ellipse(lx, floorY + 90, 145, 105, 0, 0, Math.PI * 2); ctx.fill();
    // 전선
    ctx.strokeStyle = '#2a1808'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, floorY - 24); ctx.stroke();
    // 조명 기구 (레벨별)
    if (lt >= 3) {
      ctx.fillStyle = '#c0901a';
      ctx.save(); ctx.shadowColor = '#ffc840'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.moveTo(lx - 18, floorY - 6); ctx.lineTo(lx + 18, floorY - 6);
      ctx.lineTo(lx + 12, floorY - 26); ctx.lineTo(lx - 12, floorY - 26); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,240,150,0.95)';
      ctx.beginPath(); ctx.ellipse(lx, floorY - 5, 9, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    } else if (lt >= 2) {
      ctx.fillStyle = '#8a6020';
      ctx.beginPath(); ctx.moveTo(lx - 12, floorY - 4); ctx.lineTo(lx + 12, floorY - 4);
      ctx.lineTo(lx + 8, floorY - 20); ctx.lineTo(lx - 8, floorY - 20); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,235,130,0.9)';
      ctx.beginPath(); ctx.ellipse(lx, floorY - 3, 6, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#6a4818'; ctx.beginPath(); ctx.arc(lx, floorY - 8, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,140,0.9)'; ctx.beginPath(); ctx.arc(lx, floorY - 8, 4, 0, Math.PI * 2); ctx.fill();
    }
  });
}

function _drawRestPlants(ctx, W, H, it) {
  if (it < 1) return;
  [[20, H - 6], [W - 20, H - 6]].forEach(([px, py]) => {
    // 화분
    ctx.fillStyle = '#9a5530';
    ctx.beginPath(); ctx.moveTo(px - 13, py - 18); ctx.lineTo(px + 13, py - 18);
    ctx.lineTo(px + 11, py + 4); ctx.lineTo(px - 11, py + 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7a3a18'; ctx.fillRect(px - 15, py - 22, 30, 5);
    ctx.fillStyle = '#3a2010'; ctx.fillRect(px - 11, py - 20, 22, 4);
    // 식물
    ctx.fillStyle = it >= 3 ? '#1a6824' : '#22581c';
    ctx.beginPath(); ctx.arc(px, py - 40, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = it >= 3 ? '#28a038' : '#348026';
    ctx.beginPath(); ctx.arc(px - 14, py - 30, 12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(px + 14, py - 30, 12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(px, py - 54, 11, 0, Math.PI * 2); ctx.fill();
    if (it >= 2) { // 꽃
      ctx.fillStyle = '#ff5888';
      ctx.beginPath(); ctx.arc(px, py - 60, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(px - 12, py - 52, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(px + 12, py - 52, 4, 0, Math.PI * 2); ctx.fill();
    }
  });
}

function _drawRestSofa(ctx, W, it, floorY) {
  if (it < 3) return;
  const sx = W - 96, sy = floorY + 8, sw = 88;
  ctx.fillStyle = '#6a3010'; ctx.beginPath(); ctx.roundRect(sx, sy + 10, sw, 40, 6); ctx.fill();
  ctx.fillStyle = '#8a4018';
  ctx.beginPath(); ctx.roundRect(sx, sy, sw, 18, 5); ctx.fill();
  ctx.beginPath(); ctx.roundRect(sx, sy + 10, 12, 40, 4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(sx + sw - 12, sy + 10, 12, 40, 4); ctx.fill();
  ctx.fillStyle = '#a04820'; ctx.beginPath(); ctx.roundRect(sx + 12, sy + 18, sw - 24, 28, 4); ctx.fill();
  if (it >= 4) { // 러그
    ctx.fillStyle = '#8a5030'; ctx.beginPath(); ctx.ellipse(W - 52, sy + 70, 22, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a06040'; ctx.beginPath(); ctx.ellipse(W - 52, sy + 68, 20, 7, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function _drawRestTables(ctx, W, H, tb, lt, it, floorY) {
  const tableCount = [1, 2, 3, 4, 4][Math.min(tb, 4)];
  const tableAreaW = it >= 3 ? (W - 106) : (W - 24);
  const spacing    = tableAreaW / (tableCount + 1);
  const tableY     = floorY + Math.round((H - floorY) * 0.30);
  const woodColors  = ['#7a4828','#9a5c34','#ba7040','#d48a50','#e8a060'];
  const clothColors = [null,'rgba(255,255,255,0.88)','rgba(255,248,235,0.92)','rgba(248,238,220,0.94)','rgba(240,230,210,0.96)'];
  const dishKeys   = ['d_steak','d_sushi','d_sandwich','d_taco','d_waffle'];
  for (let i = 0; i < tableCount; i++) {
    const tx = Math.round(spacing * (i + 1)) + 12;
    const ty = tableY;
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(tx + 2, ty + 28, 36, 11, 0, 0, Math.PI * 2); ctx.fill();
    // 의자 등받이
    ctx.fillStyle = woodColors[Math.min(tb, 2)];
    ctx.fillRect(tx - 14, ty - 44, 28, 16); ctx.fillRect(tx - 14, ty - 30, 28, 12);
    ctx.fillStyle = '#201008'; ctx.fillRect(tx - 14, ty - 20, 5, 20); ctx.fillRect(tx + 9, ty - 20, 5, 20);
    // 테이블보
    if (tb >= 1 && clothColors[Math.min(tb, 4)]) {
      ctx.fillStyle = clothColors[Math.min(tb, 4)]; ctx.globalAlpha = 0.95;
      ctx.beginPath(); ctx.roundRect(tx - 32, ty - 4, 64, 24, 4); ctx.fill(); ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.beginPath(); ctx.roundRect(tx - 32, ty + 18, 64, 4, 2); ctx.fill();
    }
    // 테이블 상판
    ctx.fillStyle = woodColors[Math.min(tb, 4)];
    ctx.beginPath(); ctx.roundRect(tx - 30, ty, 60, 20, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.20)'; ctx.beginPath(); ctx.roundRect(tx - 28, ty + 1, 56, 6, 4); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.roundRect(tx - 30, ty + 14, 60, 6, 2); ctx.fill();
    ctx.fillStyle = '#201008';
    [[tx - 18, ty + 20],[tx + 14, ty + 20]].forEach(([lx, ly]) => { ctx.fillRect(lx, ly, 5, 26); });
    // 의자 앞판
    ctx.fillStyle = woodColors[Math.min(tb, 2)]; ctx.fillRect(tx - 14, ty + 28, 28, 14);
    ctx.fillStyle = '#201008'; ctx.fillRect(tx - 14, ty + 40, 5, 14); ctx.fillRect(tx + 9, ty + 40, 5, 14);
    // 촛불
    if (tb >= 2) {
      ctx.fillStyle = '#f2ece0'; ctx.fillRect(tx - 3, ty - 14, 6, 14);
      const flameColor = lt >= 2 ? '#ffee44' : '#ffbb22';
      ctx.fillStyle = flameColor; ctx.shadowColor = flameColor; ctx.shadowBlur = 15;
      ctx.beginPath(); ctx.arc(tx, ty - 16, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    }
    // 와인잔
    if (tb >= 3) {
      const gx = tx + 23, gy = ty + 4;
      ctx.strokeStyle = 'rgba(255,255,255,0.70)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(gx - 5, gy); ctx.lineTo(gx + 5, gy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy + 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx - 5, gy + 10); ctx.lineTo(gx + 5, gy + 10); ctx.stroke();
      ctx.fillStyle = 'rgba(160,20,20,0.40)';
      ctx.beginPath(); ctx.ellipse(gx, gy - 5, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
    }
    // 요리 이미지
    const dishKey = dishKeys[(i + Math.max(0, S.epDone.length - 1)) % dishKeys.length];
    const dishImg = RST_IMGS[dishKey];
    const ds = 28;
    if (dishImg) { ctx.drawImage(dishImg, tx - ds / 2, ty + 2 - ds / 2, ds, ds); }
    else {
      ctx.fillStyle = '#f5eee6'; ctx.beginPath(); ctx.ellipse(tx, ty + 10, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d09050'; ctx.beginPath(); ctx.ellipse(tx, ty + 10, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    // 손님 (완료한 에피소드 수만큼 채움)
    if (i < S.epDone.length) {
      const cuY = ty + 68;
      ctx.fillStyle = 'rgba(255,210,160,0.92)'; ctx.beginPath(); ctx.arc(tx, cuY, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `hsl(${(i * 65 + 200) % 360},42%,30%)`;
      ctx.beginPath(); ctx.ellipse(tx, cuY + 21, 10, 13, 0, 0, Math.PI); ctx.fill();
    }
  }
}

function _drawRestSign(ctx, W, sg) {
  ctx.save();
  if (sg === 0) {
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillText('🌱 GARDEN KITCHEN', W / 2, 36);
  } else if (sg === 1) {
    ctx.fillStyle = '#4a2a08'; ctx.beginPath(); ctx.roundRect(W/2-88, 10, 176, 42, 6); ctx.fill();
    ctx.strokeStyle = '#8ac828'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(W/2-88, 10, 176, 42, 6); ctx.stroke();
    ctx.fillStyle = '#e8ffc0'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🌱 텃밭 키친', W/2, 32);
    ctx.fillStyle = '#aad860'; ctx.font = '10px sans-serif'; ctx.fillText('Garden Kitchen', W/2, 46);
  } else if (sg === 2) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.roundRect(W/2-96, 8, 192, 44, 8); ctx.fill();
    ctx.shadowColor = '#44ff00'; ctx.shadowBlur = 14; ctx.strokeStyle = '#44ff00'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(W/2-94, 10, 188, 40, 6); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.shadowColor = '#88ff44'; ctx.shadowBlur = 10; ctx.fillStyle = '#88ff44';
    ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🌱 GARDEN KITCHEN', W/2, 31);
    ctx.shadowBlur = 5; ctx.fillStyle = '#ccff88'; ctx.font = '10px sans-serif'; ctx.fillText('텃밭 키친', W/2, 45); ctx.shadowBlur = 0;
  } else if (sg === 3) {
    const grad = ctx.createLinearGradient(W/2-108, 0, W/2+108, 0);
    grad.addColorStop(0, '#060e02'); grad.addColorStop(.5, '#0e2006'); grad.addColorStop(1, '#060e02');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(W/2-108, 5, 216, 52, 8); ctx.fill();
    ctx.strokeStyle = '#aeff44'; ctx.lineWidth = 2.5; ctx.shadowColor = '#88ff22'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.roundRect(W/2-108, 5, 216, 52, 8); ctx.stroke(); ctx.shadowBlur = 0;
    for (let bx = W/2-98; bx <= W/2+98; bx += 17) {
      ctx.fillStyle = '#eeff88'; ctx.shadowColor = '#ccff00'; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(bx, 9, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(bx, 53, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.fillStyle = '#ccff66'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('🌱 GARDEN KITCHEN', W/2, 31); ctx.fillStyle = '#aedd44'; ctx.font = '11px sans-serif';
    ctx.fillText('텃밭 키친 · Michelin Starred', W/2, 46);
  } else { // sg === 4 — 미슐랭 스타
    const grad = ctx.createLinearGradient(W/2-110, 0, W/2+110, 0);
    grad.addColorStop(0, '#100808'); grad.addColorStop(.5, '#201200'); grad.addColorStop(1, '#100808');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(W/2-110, 4, 220, 54, 8); ctx.fill();
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.roundRect(W/2-110, 4, 220, 54, 8); ctx.stroke(); ctx.shadowBlur = 0;
    for (let bx = W/2-100; bx <= W/2+100; bx += 16) {
      ctx.fillStyle = '#ffff88'; ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(bx, 8, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(bx, 54, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.fillStyle = '#ffd700'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('⭐ 텃밭 키친 ⭐', W/2, 30); ctx.fillStyle = '#ffcc88'; ctx.font = '11px sans-serif';
    ctx.fillText('Garden Kitchen · Michelin ★★★', W/2, 46);
  }
  ctx.restore();
}

function _drawRestHud(ctx, W, H) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(W - 108, H - 30, 102, 22, 5); ctx.fill();
  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(`Lv.${S.level} · 🪙${S.coins}`, W - 8, H - 14);
}

/** 레스토랑 캔버스 전체를 다시 그림 (헬퍼 함수들을 순서대로 호출) */
function drawRest() {
  const cv  = document.getElementById('rc');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = cv.width, H = cv.height;
  const sg = S.ups.sign || 0, lt = S.ups.lighting || 0, tb = S.ups.table || 0,
        kt = S.ups.kitchen || 0, fl = S.ups.floor || 0, it = S.ups.interior || 0;
  const wallH  = Math.round(H * 0.42); // 벽 높이 (~160px)
  const ctrH   = 28;                   // 카운터 두께
  const ctrY   = wallH - ctrH;         // 카운터 상단 y (~132px)
  const floorY = wallH;                // 바닥 시작 y (~160px)

  _drawRestBackWall(ctx, W, wallH, ctrY, it);
  _drawRestWindows(ctx, W, H, sg, lt, 44, 64, 12);
  _drawRestWallDecorations(ctx, W, it);
  _drawRestCounter(ctx, W, kt, ctrY, ctrH);
  _drawRestFloor(ctx, W, H, fl, floorY);
  _drawRestLights(ctx, W, H, lt, floorY);
  _drawRestPlants(ctx, W, H, it);
  _drawRestSofa(ctx, W, it, floorY);
  _drawRestTables(ctx, W, H, tb, lt, it, floorY);
  _drawRestSign(ctx, W, sg);
  _drawRestHud(ctx, W, H);
}
/** 레스토랑 탭 하단 업그레이드 현황 바를 렌더링 */
function renderRst() {
  const listEl = document.getElementById('rst'); listEl.innerHTML = '';
  [{k:'sign',    ko:'간판·창문', en:'Sign',      e:'🪧'},
   {k:'lighting',ko:'조명',      en:'Lighting',  e:'💡'},
   {k:'table',   ko:'테이블',    en:'Table',     e:'🪑'},
   {k:'kitchen', ko:'주방',      en:'Kitchen',   e:'👨‍🍳'},
   {k:'floor',   ko:'바닥재',    en:'Flooring',  e:'🪵'},
   {k:'interior',ko:'인테리어',  en:'Interior',  e:'🎨'}
  ].forEach(upgradeDef => {
    const currentLevel = S.ups[upgradeDef.k] || 0;
    const pct = currentLevel / 4 * 100;
    listEl.innerHTML += `<div class="rs"><div class="rsl">${upgradeDef.e} ${S.lang === 'ko' ? upgradeDef.ko : upgradeDef.en}</div><div class="rsv">${['◆','◆','◆','◆'].map((d, i) => `<span style="color:${i < currentLevel ? '#c07030' : '#2a1808'}">${d}</span>`).join('')} <span style="color:#7a5030;font-size:.78em">${currentLevel}/4</span></div><div class="rs-bar"><div class="rs-bar-fill" style="width:${pct}%"></div></div></div>`;
  });
}

// ══════════════════════════════════════════════════════════════════════
// 탭 내비게이션
// ══════════════════════════════════════════════════════════════════════

function goTab(name) {
  S.tab = name;
  applyTabToDom();
  if (name === 'rest')   { drawRest(); renderRst(); }
  if (name === 'up')     renderUps();
  if (name === 'story')  renderStory();
  if (name === 'board')  { renderBanner(); goSubBoard(S.subBoard); }
  if (name === 'garden') renderHubUi();
}

function toggleLang() { S.lang = S.lang === 'ko' ? 'en' : 'ko'; save(); renderAll(); }

/** 언어 전환 또는 세션 복귀 시 모든 UI를 현재 상태에 맞게 갱신 */
function renderAll() {
  applyTabToDom();
  document.getElementById('hcoin').textContent = S.coins;
  document.getElementById('t0').textContent = T('정원', 'Garden');
  document.getElementById('t1').textContent = T('머지', 'Merge');
  document.getElementById('t2').textContent = T('스토리', 'Story');
  document.getElementById('t3').textContent = T('음식점', 'Restaurant');
  document.getElementById('t4').textContent = T('업그레이드 · 이야기', 'Upgrades · Story');
  renderXP(); renderEn();
  if (S.tab === 'board') {
    document.getElementById('m-lock-ico').style.display = meatUnlocked() ? 'none' : 'inline';
    goSubBoard(S.subBoard);
    renderBanner();
  } else {
    buildGrid(); buildGridMeat();
  }
  if (S.tab === 'garden') renderHubUi();
  if (S.tab === 'story')  renderStory();
  if (S.tab === 'up')     renderUps();
  if (S.tab === 'rest')   { drawRest(); renderRst(); }
}

// ══════════════════════════════════════════════════════════════════════
// 초기화
// ══════════════════════════════════════════════════════════════════════

// 키보드 방향키 / WASD 로 정원 캐릭터 이동
document.addEventListener('keydown', e => {
  if (S.tab !== 'garden') return;
  let moved = false;
  let targetX = S.gCharX, targetY = S.gCharY, dir = S.gCharDir;
  const step = 5; // 이동 단위(%)
  if      (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') { targetX = S.gCharX - step; dir = 'l'; moved = true; }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { targetX = S.gCharX + step; dir = 'r'; moved = true; }
  else if (e.key === 'ArrowUp'    || e.key === 'w' || e.key === 'W') { targetY = S.gCharY - step; dir = 'u'; moved = true; }
  else if (e.key === 'ArrowDown'  || e.key === 's' || e.key === 'S') { targetY = S.gCharY + step; dir = 'd'; moved = true; }
  if (!moved) return;
  S.gCharDir = dir;
  if (!moveCharConstrained(targetX, targetY)) return;
  startFarmerWalkAnim();
  save();
});

(function () {
  load(); regenEn();
  S.tab = 'garden'; // 새로고침 시 항상 정원으로 시작
  // 보드가 완전히 비어 있으면 초기 씨앗 배치
  if (S.board.every(c => c == null)) [0, 2, 4, 6, 8, 10, 12, 14].forEach(i => S.board[i] = 1);
  seedMeatIfEligible();
  // 농부 스프라이트 로드 실패 시 이모지 폴백
  const farmerImg = new Image();
  farmerImg.onerror = hubCharSpriteFail;
  farmerImg.src = FARMER_SHEET.src;
  renderAll();
  initGardenAnimals();

  // 모바일: 정원 필드 스와이프로 캐릭터 이동
  const walkField = document.getElementById('g-walk-hit');
  if (walkField) {
    const step          = 5;  // 이동 단위(%)
    const MOVE_THRESHOLD = 16; // 스와이프로 인정할 최소 px
    const MOVE_COOLDOWN  = 90; // 연속 이동 최소 간격(ms)
    let activeTouchId = null;
    let swipeEnabled  = false;
    let lastMoveAt    = 0;
    let lastX = 0, lastY = 0;

    const getTouchXY = t => ({ x: t.clientX, y: t.clientY });

    walkField.addEventListener('touchstart', ev => {
      if (S.tab !== 'garden') return;
      const touch = ev.changedTouches && ev.changedTouches[0];
      if (!touch) return;
      activeTouchId = touch.identifier;
      const { x, y } = getTouchXY(touch);
      lastX = x; lastY = y;
      // 레스토랑 문·냉동창고 버튼 위에서 시작하면 스와이프 비활성화 (click 우선)
      const startEl = ev.target;
      swipeEnabled = !(startEl?.closest?.('.hub-tavern-door') || startEl?.closest?.('.hub-freezer-wrap'));
      if (swipeEnabled) ev.preventDefault();
    }, {passive: false});

    walkField.addEventListener('touchmove', ev => {
      if (S.tab !== 'garden' || activeTouchId == null || !swipeEnabled) return;
      const touch = Array.from(ev.changedTouches || []).find(t => t.identifier === activeTouchId);
      if (!touch) return;
      const now = Date.now();
      if (now - lastMoveAt < MOVE_COOLDOWN) return;
      const { x, y } = getTouchXY(touch);
      const dx = x - lastX, dy = y - lastY;
      if (Math.abs(dx) < MOVE_THRESHOLD && Math.abs(dy) < MOVE_THRESHOLD) return;
      lastMoveAt = now;
      // 더 큰 이동 축 기준으로 방향 결정
      let targetX = S.gCharX, targetY = S.gCharY, dir = S.gCharDir;
      if (Math.abs(dx) >= Math.abs(dy)) {
        dir = dx > 0 ? 'r' : 'l';
        targetX = S.gCharX + (dx > 0 ? step : -step);
      } else {
        dir = dy > 0 ? 'd' : 'u';
        targetY = S.gCharY + (dy > 0 ? step : -step);
      }
      S.gCharDir = dir;
      if (moveCharConstrained(targetX, targetY)) { syncHubCharFull(); startFarmerWalkAnim(); save(); }
      lastX = x; lastY = y;
      _hubSkipNextWalkClickUntil = Date.now() + 450;
      ev.preventDefault();
    }, {passive: false});

    const resetTouch = () => { activeTouchId = null; swipeEnabled = false; };
    walkField.addEventListener('touchend',   resetTouch, {passive: true});
    walkField.addEventListener('touchcancel', resetTouch, {passive: true});
  }
})();
</script>
